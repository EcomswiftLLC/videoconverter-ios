name: Release to App Store Connect

# Manual only. Signs with cloud-managed certificates through the App Store Connect FXI key
# (secrets ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64), archives the Release configuration
# and uploads the build to App Store Connect (TestFlight, then App Review).

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then echo "No Xcode 26 on this runner"; exit 1; fi
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch the LGPL FFmpeg build (when pinned)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ffmpeg/fetch_ffmpeg.py

      - name: Generate project
        run: xcodegen generate

      - name: Write FXI key
        env:
          KEY_B64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey.p8"

      - name: Archive (unsigned; the export step signs it)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive             -project Fluxa.xcodeproj             -scheme Fluxa             -configuration Release             -destination "generic/platform=iOS"             -archivePath build/Fluxa.xcarchive             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             CURRENT_PROJECT_VERSION=${{ github.run_number }}             | tee build/archive.log | tail -n 40

      - name: Validate privacy manifests (ITMS-91064)
        run: |
          # App Store Connect rejects any manifest with NSPrivacyTracking=true and no NSPrivacyTrackingDomains.
          # We declare no tracking domains (iOS would block them for people who deny ATT), so every manifest must be false/absent.
          PB=/usr/libexec/PlistBuddy
          FXP=build/Fluxa.xcarchive/Products/Applications/Fluxa.app
          find "$FXP" -name PrivacyInfo.xcprivacy | while read -r f; do
            tracking=$($PB -c "Print :NSPrivacyTracking" "$f" 2>/dev/null || echo missing)
            domains=$($PB -c "Print :NSPrivacyTrackingDomains" "$f" 2>/dev/null | grep -c . || true)
            echo "$f: NSPrivacyTracking=$tracking domains-lines=$domains"
            if [ "$tracking" = "true" ] && [ "$domains" -le 2 ]; then
              $PB -c "Set :NSPrivacyTracking false" "$f"
              echo "  -> set NSPrivacyTracking false (no tracking domains declared)"
            fi
          done

      - name: Check production ad ids in the archive
        run: |
          FXP=build/Fluxa.xcarchive/Products/Applications/Fluxa.app
          /usr/libexec/PlistBuddy -c "Print :GADApplicationIdentifier" "$FXP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$FXP/Info.plist"
          # The app id and both unit ids must be real: not Google's test id (3940256099942544) and not an unresolved $(...) setting.
          for KEY in GADApplicationIdentifier FXBannerAdUnitID FXRewardedAdUnitID; do
            VALUE="$(/usr/libexec/PlistBuddy -c "Print :$KEY" "$FXP/Info.plist")"
            echo "$KEY = $VALUE"
            if [ -z "$VALUE" ]; then
              echo "$KEY is empty in the archive" && exit 1
            fi
            case "$VALUE" in
              *3940256099942544*) echo "$KEY uses the Google test id" && exit 1 ;;
              '$('*) echo "$KEY was not filled in (still $VALUE)" && exit 1 ;;
            esac
          done

      - name: Check the ad code paths are in the Release binary
        run: |
          # The banner and the rewarded gate must ship in the Release build, and the ad SDKs must be embedded.
          FXP=build/Fluxa.xcarchive/Products/Applications/Fluxa.app
          BIN="$FXP/Fluxa"
          for NEEDLE in GADBannerView GADRewardedAd RewardedGate UMPConsentInformation; do
            COUNT=$(strings -a "$BIN" "$FXP"/Frameworks/*.framework/* 2>/dev/null | grep -c "$NEEDLE" || true)
            echo "$NEEDLE: $COUNT"
            if [ "$COUNT" -eq 0 ]; then echo "Missing $NEEDLE in the Release build" && exit 1; fi
          done
          # And the debug-only screen launcher must not be shipped.
          if strings -a "$BIN" | grep -q "fxScreen"; then echo "Debug screen launcher found in the Release build" && exit 1; fi

      - name: Create distribution certificate and profile (short-lived)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUNDLE_ID: com.ecomswift.fluxa
        run: |
          set -e
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyjwt cryptography
          export ASC_KEY_PATH="$RUNNER_TEMP/keys/AuthKey.p8"
          export P12_PASSWORD="$(uuidgen)"
          echo "P12_PASSWORD=$P12_PASSWORD" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/venv/bin/python" tools/ci_signing.py create "$RUNNER_TEMP/signing"
          KC="$RUNNER_TEMP/release.keychain-db"
          security create-keychain -p ci-pass "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p ci-pass "$KC"
          security import "$RUNNER_TEMP/signing/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k ci-pass "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['profile_uuid'])" "$RUNNER_TEMP/signing/state.json")
          cp "$RUNNER_TEMP/signing/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['profile_name'])" "$RUNNER_TEMP/signing/state.json" > "$RUNNER_TEMP/signing/profile_name.txt"

      - name: Inspect the signed IPA (privacy manifests)
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          PROFILE_NAME="$(cat "$RUNNER_TEMP/signing/profile_name.txt")"
          cat > build/ExportLocal.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>N84NGN3KSH</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>com.ecomswift.fluxa</key><string>${PROFILE_NAME}</string></dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/Fluxa.xcarchive -exportOptionsPlist build/ExportLocal.plist -exportPath build/export-local 2>&1 | tail -n 5
          mkdir -p build/ipa && cd build/ipa && unzip -q ../export-local/*.ipa
          find . -iname "*.xcprivacy" | while read -r f; do
            echo "=== $f"
            echo "head:"; head -c 160 "$f" | cat -v | head -4
            echo -n "tracking: "; /usr/libexec/PlistBuddy -c "Print :NSPrivacyTracking" "$f" 2>&1 || true
            echo "domains:"; /usr/libexec/PlistBuddy -c "Print :NSPrivacyTrackingDomains" "$f" 2>&1 || true
          done
          echo "--- bundle contents (top level):"; ls Payload/Fluxa.app | head -40

      - name: Export and upload
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          PROFILE_NAME="$(cat "$RUNNER_TEMP/signing/profile_name.txt")"
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>N84NGN3KSH</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>com.ecomswift.fluxa</key><string>${PROFILE_NAME}</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive             -archivePath build/Fluxa.xcarchive             -exportOptionsPlist build/ExportOptions.plist             -exportPath build/export             -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8"             -authenticationKeyID "$KEY_ID"             -authenticationKeyIssuerID "$ISSUER_ID"             2>&1 | tee build/export.log | tail -n 60

      - name: Delete the short-lived certificate and profile
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/keys/AuthKey.p8"
          "$RUNNER_TEMP/venv/bin/python" tools/ci_signing.py cleanup "$RUNNER_TEMP/signing" || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs
          path: build/*.log
          if-no-files-found: ignore

      - name: Remove FXI key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
